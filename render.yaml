services:
  - type: web
    name: solar-admin-panel
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solar-admin-postgres
          property: connectionString

databases:
  - name: solar-admin-postgres
    plan: free
    databaseName: solar_admin_db
    user: solar_admin
